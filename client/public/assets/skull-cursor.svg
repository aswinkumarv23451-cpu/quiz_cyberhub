    <path d="M12 12 L19 19 M19 12 L12 19" stroke="#A88454" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Skull Face -->
    <path d="M13.5 15 C13.5 13.5 14.3 12.8 15.5 12.8 C16.7 12.8 17.5 13.5 17.5 15 C17.5 16 16.9 16.6 16.5 17 L14.5 17 C14.1 16.6 13.5 16 13.5 15 Z" fill="#F4EEDD" stroke="#181410" stroke-width="0.6"/>
    <circle cx="14.7" cy="14.8" r="0.5" fill="#181410"/>
    <circle cx="16.3" cy="14.8" r="0.5" fill="#181410"/>
  </g>
</svg>
