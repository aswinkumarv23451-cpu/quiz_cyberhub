<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Precision navigation pointer tip at (2,2) with stylized pirate skull crest -->
  <g filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.9))">
    <!-- Top-left pointer blade -->
    <path d="M2 2 L9 18 L12 12 L18 9 Z" fill="#D4AF37" stroke="#121316" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M2 2 L12 12" stroke="#F4EEDD" stroke-width="0.8"/>
    <!-- Pirate Skull Medallion -->
    <circle cx="15.5" cy="15.5" r="5.5" fill="#181410" stroke="#D4AF37" stroke-width="1"/>
